[project]
name = "polymarket-ai-trader"
version = "0.1.0"
description = "Profitability-first autonomous AI trading agent for Polymarket with strict capital protection. ~$10 starting capital, ~$10 API budget. DuckDB primary, cross-platform."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Polymarket AI Trader Contributors"}
]
keywords = ["polymarket", "prediction-markets", "trading-agent", "ai", "duckdb", "polygon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

dependencies = [
    # Official Polymarket unified SDK (beta but current recommended)
    "polymarket-client>=0.1.0a0",

    # Core async + HTTP
    "httpx>=0.27",
    "asyncio",

    # Configuration & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # LLM abstraction (multi-provider, cost tracking)
    "litellm>=1.40",

    # Database - DuckDB primary (excellent embedded analytics)
    "duckdb>=1.1",

    # CLI
    "typer[all]>=0.12",

    # Research (free/cheap news)
    "feedparser>=6.0",

    # Data & utilities
    "python-dotenv>=1.0",
    "rich>=13.9",
    "structlog>=24.4",

    # Date / time
    "python-dateutil>=2.9",

    # Optional but recommended for nicer UX
    "textual>=0.80",   # future TUI dashboard
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio",
    "pytest-mock",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material",
]

[project.scripts]
polymarket-trader = "polymarket_trader.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/polymarket"
Repository = "https://github.com/your-org/polymarket"
Issues = "https://github.com/your-org/polymarket/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_trader"]

[tool.uv]
dev-dependencies = [
    "polymarket-client>=0.1.0a0", # allow pre-releases for beta SDK
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"] # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# No custom sources needed for now. The beta SDK is installed via the main dependencies
# with --pre / prerelease allow in practice.
