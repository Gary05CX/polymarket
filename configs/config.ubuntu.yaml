# Ubuntu DEFAULT long-run = HALF-TIGHT (post paper-bold analysis).
# Data said: mid 0.64–0.70 lost heavily; ETH + high-price B dragged PnL.
# Keep dry_run until multi-day paper is clearly positive.
#
# Profiles:
#   configs/config.ubuntu.yaml                 ← this file (half-tight ~$1–3, default)
#   configs/config.ubuntu.half-tight.yaml      ← same content, explicit name
#   configs/config.ubuntu.half-tight-size5.yaml ← half-tight ~$5 (paper first)
#   configs/config.ubuntu.live-size2-3.yaml    ← half-tight ~$2–3 + $10 risk caps
#   configs/config.ubuntu.paper-bold.yaml      ← aggressive sample collection
#   configs/config.ubuntu.strict.yaml          ← most conservative
# Live: docs/LIVE-CHECKLIST.md
#
# .env:
#   CONFIG_PATH=configs/config.ubuntu.yaml
#   DB_DRIVER=postgres
#   DATABASE_URL=postgres://polymarket:SECRET@127.0.0.1:5432/polymarket?sslmode=disable
#   DRY_RUN=true

assets:
  - btc
  - eth

timeframes:
  - 5m

binance:
  ws_base: "wss://stream.binance.com:9443/ws"
  symbols:
    btc: btcusdt
    eth: ethusdt
    sol: solusdt
  stale_ms: 5000

gamma:
  base_url: "https://gamma-api.polymarket.com"
  timeout_ms: 8000

clob:
  host: "https://clob.polymarket.com"
  chain_id: 137
  dry_run: true

database:
  driver: postgres
  duckdb_path: "data/bot.duckdb"

duckdb:
  path: "data/bot.duckdb"

loop:
  poll_interval_ms: 1500
  snapshot_every_n_ticks: 5
  reject_summary_every_n_ticks: 40
  open_price_max_age_sec: 45
  checkpoint_every_n_ticks: 200

discovery:
  cache_ttl_ms: 8000
  previous_window_grace_sec: 15

fair_value:
  k: "1.5"
  default_sigma: "0.003"
  p_min: "0.10"
  p_max: "0.90"
  vol_window: 60

# A: keep cheap band that paper-showed +EV; cut 0.64–0.70 bleed
strategy_a:
  enabled: true
  price_min: "0.55"
  price_max: "0.62"          # 0.62–0.64 paper −EV (WR ~59%); was 0.64 then 0.70
  min_edge: "0.03"
  max_edge: "0.20"
  edge_slope: "0.25"
  reject_fair_at_clamp: true
  size_min_usd: "1"
  size_max_usd: "3"
  min_seconds_left: 50
  limit_price_mode: "mid"

# B: keep lag idea but smaller size + cheaper max mid
strategy_b:
  enabled: true
  price_move_threshold: "0.0009"  # 0.09%
  max_size_usd: "3"               # was 5
  min_edge: "0.08"                # was 0.035 — cheap B already has huge edge
  max_market_price: "0.55"        # was 0.62; 0.55–0.62 paper net ≤0
  min_seconds_left: 35
  limit_price_mode: "mid"
  reject_fair_at_clamp: true

risk:
  max_position_usd_per_market: "8"
  max_open_markets: 5
  max_daily_loss_usd: "30"
  max_hourly_loss_usd: "15"
  hard_min_seconds_left: 18
  one_order_per_strategy: true
  one_order_per_market: true      # A and B cannot both fire on same window
  max_spread: "0.06"
  paper_fill_at_mid: true
  paper_fee_bps: 120

monitor:
  log_level: "info"
