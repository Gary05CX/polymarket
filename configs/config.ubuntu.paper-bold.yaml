# Ubuntu PAPER-BOLD profile — more trades for data collection.
# dry_run only. Expect noisier PnL; tighten later after 30–50+ settles.
#
# .env:
#   CONFIG_PATH=configs/config.ubuntu.paper-bold.yaml
#   DB_DRIVER=postgres
#   DATABASE_URL=postgres://...
#   DRY_RUN=true

assets:
  - btc
  - eth

timeframes:
  - 5m

binance:
  ws_base: "wss://stream.binance.com:9443/ws"
  symbols:
    btc: btcusdt
    eth: ethusdt
    sol: solusdt
  stale_ms: 5000

gamma:
  base_url: "https://gamma-api.polymarket.com"
  timeout_ms: 8000

clob:
  host: "https://clob.polymarket.com"
  chain_id: 137
  dry_run: true

database:
  driver: postgres
  duckdb_path: "data/bot.duckdb"
  # prefer DATABASE_URL in .env

duckdb:
  path: "data/bot.duckdb"

loop:
  poll_interval_ms: 1500
  snapshot_every_n_ticks: 5
  reject_summary_every_n_ticks: 40
  open_price_max_age_sec: 45
  checkpoint_every_n_ticks: 200

discovery:
  cache_ttl_ms: 8000
  previous_window_grace_sec: 15

# Slightly looser fair model → fewer "stuck at bound" rejects
fair_value:
  k: "1.6"
  default_sigma: "0.0025"
  p_min: "0.08"
  p_max: "0.92"
  vol_window: 60

# --- Strategy A: wider band, flatter edge, allow clamp ---
strategy_a:
  enabled: true
  price_min: "0.55"
  price_max: "0.70"
  min_edge: "0.025"
  # high ceiling so inflated edges still log as trades (paper)
  max_edge: "0.35"
  edge_slope: "0.15"
  reject_fair_at_clamp: false
  size_min_usd: "1"
  size_max_usd: "3"
  min_seconds_left: 45
  limit_price_mode: "mid"

# --- Strategy B: easier lag trigger, higher max mid ---
strategy_b:
  enabled: true
  price_move_threshold: "0.0008"  # 0.08%
  max_size_usd: "5"
  min_edge: "0.03"
  max_market_price: "0.75"
  min_seconds_left: 30
  limit_price_mode: "mid"
  reject_fair_at_clamp: false

risk:
  max_position_usd_per_market: "10"
  max_open_markets: 6
  max_daily_loss_usd: "40"
  max_hourly_loss_usd: "20"
  hard_min_seconds_left: 15
  # keep: no double-fire pollution
  one_order_per_strategy: true
  max_spread: "0.08"
  paper_fill_at_mid: true
  # slightly lower fee so paper isn't dominated by fees while exploring
  paper_fee_bps: 100

monitor:
  log_level: "info"
