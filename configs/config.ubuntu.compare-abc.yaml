# Dry-run COMPARE: Strategy A + B + C run together on the same markets.
#
# - one_order_per_market: false  → each strategy can take its own order
# - one_order_per_strategy: true → still max 1 order per strategy per window
# - Per-order settle_pnl_usd written at settle (do NOT sum markets.settle_pnl by strategy)
#
# .env:
#   CONFIG_PATH=configs/config.ubuntu.compare-abc.yaml
#   DRY_RUN=true
#   DB_DRIVER=postgres
#
# Query compare:
#   SELECT strategy, COUNT(*),
#     COUNT(*) FILTER (WHERE settle_pnl_usd::numeric > 0) w,
#     COUNT(*) FILTER (WHERE settle_pnl_usd::numeric < 0) l,
#     ROUND(SUM(settle_pnl_usd::numeric),2) pnl
#   FROM orders
#   WHERE settle_pnl_usd IS NOT NULL AND created_at > now() - interval '1 day'
#   GROUP BY strategy;

assets:
  - btc
  - eth

timeframes:
  - 5m

binance:
  ws_base: "wss://stream.binance.com:9443/ws"
  symbols:
    btc: btcusdt
    eth: ethusdt
    sol: solusdt
  stale_ms: 5000

gamma:
  base_url: "https://gamma-api.polymarket.com"
  timeout_ms: 8000

clob:
  host: "https://clob.polymarket.com"
  chain_id: 137
  dry_run: true

database:
  driver: postgres
  duckdb_path: "data/bot.duckdb"

duckdb:
  path: "data/bot.duckdb"

loop:
  poll_interval_ms: 1500
  snapshot_every_n_ticks: 5
  reject_summary_every_n_ticks: 40
  open_price_max_age_sec: 45
  checkpoint_every_n_ticks: 200

discovery:
  cache_ttl_ms: 8000
  previous_window_grace_sec: 15

fair_value:
  k: "1.5"
  default_sigma: "0.003"
  p_min: "0.10"
  p_max: "0.90"
  vol_window: 60

# A: half-tight cheap edge (~$2–3 size band)
strategy_a:
  enabled: true
  price_min: "0.55"
  price_max: "0.64"
  min_edge: "0.03"
  max_edge: "0.20"
  edge_slope: "0.25"
  reject_fair_at_clamp: true
  size_min_usd: "2"
  size_max_usd: "3"
  min_seconds_left: 50
  limit_price_mode: "mid"

# B: lag harvest (rarely fires under tight max mid)
strategy_b:
  enabled: true
  price_move_threshold: "0.0009"
  max_size_usd: "3"
  min_edge: "0.035"
  max_market_price: "0.62"
  min_seconds_left: 35
  limit_price_mode: "mid"
  reject_fair_at_clamp: true

# C: manual momentum (BTC>$2 / ETH>$0.2 after 1m, hold 2m, $5)
strategy_c:
  enabled: true
  size_usd: "5"
  min_elapsed_sec: 60
  sustained_above_sec: 120
  btc_move_usd: "2"
  eth_move_usd: "0.2"
  mid_min: "0.55"
  mid_max: "0.88"
  min_seconds_left: 25
  limit_price_mode: "mid"
  stability_wait_sec: 45
  stability_lookback_sec: 30
  retrace_epsilon_usd: "0.15"
  max_consecutive_losses: 2
  cooldown_sec: 2700

risk:
  # Higher caps: A+B+C may each hold exposure on same window (paper compare)
  max_position_usd_per_market: "20"
  max_open_markets: 8
  max_daily_loss_usd: "80"
  max_hourly_loss_usd: "40"
  hard_min_seconds_left: 18
  one_order_per_strategy: true
  one_order_per_market: false   # KEY for parallel compare
  max_spread: "0.08"
  paper_fill_at_mid: true
  paper_fee_bps: 120

monitor:
  log_level: "info"
