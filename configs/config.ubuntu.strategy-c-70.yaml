# Strategy C only — manual "70% momentum" dry-run profile.
# See docs/MANUAL-STRATEGY-70PCT-MOMENTUM.md
#
# Rules (from live manual notes):
#   - BTC |spot-open| >= $10, ETH >= $1
#   - elapsed >= 2 minutes
#   - buy ~$5 on leading side when mid in ~0.65–0.75 (not 90%+)
#   - if price retraces toward open: wait ~45s; still unstable → skip
#   - 2 consecutive losses → cooldown ~45 minutes
#
# .env:
#   CONFIG_PATH=configs/config.ubuntu.strategy-c-70.yaml
#   DRY_RUN=true
#   DB_DRIVER=postgres
#   DATABASE_URL=...

assets:
  - btc
  - eth

timeframes:
  - 5m

binance:
  ws_base: "wss://stream.binance.com:9443/ws"
  symbols:
    btc: btcusdt
    eth: ethusdt
    sol: solusdt
  stale_ms: 5000

gamma:
  base_url: "https://gamma-api.polymarket.com"
  timeout_ms: 8000

clob:
  host: "https://clob.polymarket.com"
  chain_id: 137
  dry_run: true

database:
  driver: postgres
  duckdb_path: "data/bot.duckdb"

duckdb:
  path: "data/bot.duckdb"

loop:
  poll_interval_ms: 1500
  snapshot_every_n_ticks: 5
  reject_summary_every_n_ticks: 40
  open_price_max_age_sec: 45
  checkpoint_every_n_ticks: 200

discovery:
  cache_ttl_ms: 8000
  previous_window_grace_sec: 15

fair_value:
  k: "1.5"
  default_sigma: "0.003"
  p_min: "0.10"
  p_max: "0.90"
  vol_window: 60

# Disable A/B so paper stats are pure Strategy C
strategy_a:
  enabled: false
  price_min: "0.55"
  price_max: "0.64"
  min_edge: "0.03"
  max_edge: "0.20"
  edge_slope: "0.25"
  reject_fair_at_clamp: true
  size_min_usd: "1"
  size_max_usd: "3"
  min_seconds_left: 50
  limit_price_mode: "mid"

strategy_b:
  enabled: false
  price_move_threshold: "0.0009"
  max_size_usd: "3"
  min_edge: "0.035"
  max_market_price: "0.62"
  min_seconds_left: 35
  limit_price_mode: "mid"
  reject_fair_at_clamp: true

strategy_c:
  enabled: true
  size_usd: "5"
  min_elapsed_sec: 120
  btc_move_usd: "10"
  eth_move_usd: "1"
  mid_min: "0.65"
  mid_max: "0.75"
  min_seconds_left: 25
  limit_price_mode: "mid"
  stability_wait_sec: 45
  stability_lookback_sec: 30
  retrace_epsilon_usd: "0.3"
  max_consecutive_losses: 2
  cooldown_sec: 2700

risk:
  max_position_usd_per_market: "6"
  max_open_markets: 2
  max_daily_loss_usd: "40"
  max_hourly_loss_usd: "20"
  hard_min_seconds_left: 18
  one_order_per_strategy: true
  one_order_per_market: true
  max_spread: "0.08"
  paper_fill_at_mid: true
  paper_fee_bps: 120

monitor:
  log_level: "info"
