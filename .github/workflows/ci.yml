name: CI

on:
  push:
    branches: [main, feat/polymarket-ai-trading-agent]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy, non-strict for early stage)
        run: uv run mypy src --ignore-missing-imports || true

      - name: Test (critical risk rules)
        run: uv run pytest tests/test_risk_manager.py -q --tb=short
